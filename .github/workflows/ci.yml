name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # the weekly Upstream workflow runs this on its upstream/bump branch
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 22, 24]
        include:
          - os: windows-latest
            node: 22
          - os: macos-latest
            node: 22
    runs-on: ${{ matrix.os }}
    env:
      # the Firebase Emulator Suite end-to-end test runs on Node 22 only (it takes ~1 min)
      ACCESSPROBE_SKIP_FIREBASE: ${{ matrix.node != 22 && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-java@v6
        if: matrix.node == 22
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v6
        if: matrix.node == 22
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('test/versions.json') }}
      # the PocketBase end-to-end test downloads the release binary pinned in test/versions.json
      - uses: actions/cache@v6
        with:
          path: ~/.cache/accessprobe
          key: pocketbase-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('test/versions.json') }}
      - run: npm test

  # install the packed tarball like `npx accessprobe` would, then use the installed binary
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node test/package-smoke.mjs
