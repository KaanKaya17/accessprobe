name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 22, 24]
        include:
          - os: windows-latest
            node: 22
    runs-on: ${{ matrix.os }}
    env:
      # the Firebase Emulator Suite end-to-end test runs on Node 22 only (it takes ~1 min)
      RLSPROBE_SKIP_FIREBASE: ${{ matrix.node != 22 && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-java@v6
        if: matrix.node == 22
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v6
        if: matrix.node == 22
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-15.35.0
      - run: npm test

  # install the packed tarball like `npx rlsprobe` would, then use the installed binary
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node test/package-smoke.mjs
