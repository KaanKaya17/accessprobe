name: Backend e2e
# Runs accessprobe against a real local Supabase (Postgres + PostgREST + GoTrue) started from
# test/supabase-local/supabase/migrations, then runs the GitHub Action (uses: ./) the same way.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # the weekly Upstream workflow runs this on its upstream/bump branch
permissions:
  contents: read
jobs:
  real-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Pinned backend versions (test/versions.json)
        run: node test/versions.mjs | tee -a "$GITHUB_ENV"
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }} # pinned: resolving "latest" hits the GitHub API rate limit
      - name: Start local Supabase with the fixture migrations
        working-directory: test/supabase-local
        run: |
          [ -f supabase/config.toml ] || supabase init < /dev/null
          supabase start
          eval "$(supabase status -o env)"
          key="${ANON_KEY:-$PUBLISHABLE_KEY}"
          [ -n "$API_URL" ] && [ -n "$key" ] || { supabase status -o env | cut -d= -f1; echo "API_URL / ANON_KEY missing"; exit 1; }
          echo "SB_URL=$API_URL" >> "$GITHUB_ENV"
          echo "SB_ANON=$key" >> "$GITHUB_ENV"
          echo "SB_DB=$DB_URL" >> "$GITHUB_ENV"
      - name: accessprobe against real Postgres
        run: |
          set +e
          node bin/accessprobe.js --url "$SB_URL" --anon-key "$SB_ANON" --source test/supabase-local --yes --json             --pgtap test/supabase-local/supabase/tests/accessprobe.test.sql --sarif accessprobe.sarif > result.json
          code=$?
          set -e
          echo "exit code $code (1 expected: the fixture has critical leaks)"
          [ "$code" = 1 ] || { cat result.json; exit 1; }
          node test/supabase-local/check.mjs result.json
          # wipe_canary() deletes rows: accessprobe must never have run it
          test "$(psql "$SB_DB" -X -q -t -A -c 'select count(*) from public.canary')" = 1 || { echo "canary row is gone: a data-changing function was executed"; exit 1; }
      - name: SARIF output is valid SARIF 2.1.0 and points into the migrations
        run: |
          curl -sfL https://json.schemastore.org/sarif-2.1.0.json -o sarif-schema.json
          pipx run check-jsonschema --schemafile sarif-schema.json accessprobe.sarif
          node test/supabase-local/check-sarif.mjs accessprobe.sarif result.json
      - name: --read-only changes nothing in the database
        run: |
          for u in ro-a ro-b; do
            curl -sf -X POST "$SB_URL/auth/v1/signup" -H "apikey: $SB_ANON" -H 'Content-Type: application/json'               -d "{\"email\":\"$u@example.com\",\"password\":\"Ro-Passw0rd-123\"}" > /dev/null
          done
          psql "$SB_DB" -X -q -t -A -f test/supabase-local/snapshot.sql > before.txt
          set +e
          node bin/accessprobe.js --url "$SB_URL" --anon-key "$SB_ANON" --source test/supabase-local --yes --json --read-only             --user-a ro-a@example.com:Ro-Passw0rd-123 --user-b ro-b@example.com:Ro-Passw0rd-123 > ro.json
          code=$?
          set -e
          psql "$SB_DB" -X -q -t -A -f test/supabase-local/snapshot.sql > after.txt
          echo "exit code $code"
          [ "$code" = 0 ] || [ "$code" = 1 ] || { cat ro.json; exit 1; }
          diff before.txt after.txt || { echo "--read-only changed the database"; exit 1; }
          node -e 'const r=require("./ro.json"); if(!r.notes[0].startsWith("Read-only run")) throw new Error("no read-only note"); if(r.passed.some(p=>/cannot (insert|update|change|delete|create|upload|forge)/i.test(p))) throw new Error("write check claimed as passed: "+r.passed.join("; ")); console.log(r.findings.length+" findings from existing data, "+r.passed.length+" passed")'
      - name: Generated pgTAP tests fail exactly where accessprobe proved a leak
        working-directory: test/supabase-local
        run: |
          T=supabase/tests/accessprobe.test.sql
          psql "$SB_DB" -X -q -t -A -f "$T" > tap.txt 2>&1 || true
          node check-pgtap.mjs "$T" tap.txt
          if supabase test db; then echo "supabase test db should fail before the fix"; exit 1; fi
      - name: After applying the fixes, every pgTAP test passes
        working-directory: test/supabase-local
        run: |
          T=supabase/tests/accessprobe.test.sql
          psql "$SB_DB" -X -q -v ON_ERROR_STOP=1 -f fix.sql
          psql "$SB_DB" -X -q -t -A -f "$T" > tap-fixed.txt 2>&1 || true
          node check-pgtap.mjs "$T" tap-fixed.txt --fixed
          supabase test db
          supabase db reset
      - name: The GitHub Action (uses ./) on the same project
        id: action
        uses: ./
        with:
          args: --url ${{ env.SB_URL }} --anon-key ${{ env.SB_ANON }} --source test/supabase-local --quiet
          fail-on: never
          sarif: accessprobe-action.sarif
      - name: Action outputs
        run: |
          test "${{ steps.action.outputs.exit-code }}" = 1
          test -s "${{ steps.action.outputs.report }}"
          grep -q "security_invoker = true" "${{ steps.action.outputs.report }}"
          test "${{ steps.action.outputs.sarif }}" = accessprobe-action.sarif
          node -e 'const s=JSON.parse(require("fs").readFileSync("accessprobe-action.sarif","utf8")); if(!s.runs[0].results.length) throw new Error("empty SARIF")'
          echo "Action reported exit code 1 and wrote the report."

  firebase-action:
    # The README's Firebase example, as written: emulators in the background, then the Action.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Pinned backend versions (test/versions.json)
        run: node test/versions.mjs | tee -a "$GITHUB_ENV"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Start the Firebase emulators
        working-directory: test/firebase
        run: npx --yes firebase-tools@$FIREBASE_TOOLS_VERSION emulators:start --only auth,firestore,database,storage --project demo-ci > emulators.log 2>&1 &
      - name: Wait for the emulators
        run: npx --yes wait-on@8.0.3 --timeout 180000 tcp:127.0.0.1:8080 tcp:127.0.0.1:9099 tcp:127.0.0.1:9000 tcp:127.0.0.1:9199
      - name: The GitHub Action (uses ./) against the emulators
        id: action
        uses: ./
        with:
          working-directory: test/firebase
          args: --project-id demo-ci --api-key fake --source . --emulator --quiet
          fail-on: never
      - name: Action outputs
        run: |
          test "${{ steps.action.outputs.exit-code }}" = 1
          grep -q "members" "test/firebase/${{ steps.action.outputs.report }}"
          echo "Firebase: the Action reported exit code 1 and found the seeded leaks."
      - if: failure()
        run: cat test/firebase/emulators.log | tail -50

  firebase-rules-tests:
    # --rules-tests: the generated Security Rules tests run the way the README says (firebase
    # emulators:exec + node --test, @firebase/rules-unit-testing installed by the "user"), and
    # exactly the tests for leaks accessprobe proved fail.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Pinned backend versions (test/versions.json)
        run: node test/versions.mjs | tee -a "$GITHUB_ENV"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: accessprobe against the emulators writes the rules tests
        working-directory: test/firebase
        run: |
          RT="$RUNNER_TEMP/rt"
          echo "RT=$RT" >> "$GITHUB_ENV"
          export RT
          mkdir -p "$RT"
          npx --yes firebase-tools@$FIREBASE_TOOLS_VERSION emulators:exec --only auth,firestore,database,storage --project demo-ci \
            'node "$GITHUB_WORKSPACE/bin/accessprobe.js" --project-id demo-ci --api-key fake --source . --emulator --yes --quiet --rules-tests "$RT/accessprobe.rules.test.mjs"; echo $? > "$RT/code"'
          echo "accessprobe exit code $(cat "$RT/code") (1 expected: the fixture has critical leaks)"
          test "$(cat "$RT/code")" = 1
          head -20 "$RT/accessprobe.rules.test.mjs"
      - name: Install @firebase/rules-unit-testing (pinned) next to the generated file
        working-directory: ${{ env.RT }}
        run: |
          npm init -y > /dev/null
          npm i --no-audit --no-fund @firebase/rules-unit-testing@6.0.0 firebase@13.2.0
      - name: Generated rules tests fail exactly where accessprobe proved a leak
        working-directory: test/firebase
        run: |
          npx --yes firebase-tools@$FIREBASE_TOOLS_VERSION emulators:exec --only firestore,database,storage --project demo-ci \
            'node --test --test-reporter=tap "$RT/accessprobe.rules.test.mjs" > "$RT/tap.txt" 2>&1; true'
          node check-rules-tests.mjs "$RT/accessprobe.rules.test.mjs" "$RT/tap.txt"

  real-appwrite:
    # A real self-hosted Appwrite (pinned) with the fixture's appwrite.json: broken and correct
    # collections, a TablesDB table and buckets. setup.mjs uses a server key for FIXTURE SETUP
    # ONLY; accessprobe gets nothing but the endpoint and the project id.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Pinned backend versions (test/versions.json)
        run: node test/versions.mjs | tee -a "$GITHUB_ENV"
      - name: Install the pinned Appwrite (non-interactive)
        run: |
          mkdir -p "$RUNNER_TEMP/aw"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUNNER_TEMP/aw/appwrite":/usr/src/code/appwrite:rw \
            --entrypoint=install "appwrite/appwrite:$APPWRITE_VERSION" \
            --http-port=80 --https-port=443 --interactive=N --no-start=true
          cd "$RUNNER_TEMP/aw/appwrite"
          ls -la
          # the test signs up several users per minute: no abuse rate limits (files are root-owned)
          if grep -q '^_APP_OPTIONS_ABUSE=' .env; then sudo sed -i 's/^_APP_OPTIONS_ABUSE=.*/_APP_OPTIONS_ABUSE=disabled/' .env; else echo '_APP_OPTIONS_ABUSE=disabled' | sudo tee -a .env; fi
          grep -E '^_APP_(OPTIONS_ABUSE|CONSOLE_WHITELIST|DOMAIN|ENV)' .env || true
          docker compose up -d --quiet-pull
      - name: Wait for /v1/health/version
        run: |
          for i in $(seq 1 120); do
            if curl -sf http://localhost/v1/health/version; then echo; exit 0; fi
            sleep 5
          done
          docker compose -f "$RUNNER_TEMP/aw/appwrite/docker-compose.yml" ps
          exit 1
      - name: Fixture setup (console account, project, server key, appwrite.json schema)
        run: node test/appwrite/setup.mjs http://localhost/v1
      - name: accessprobe against real Appwrite
        run: |
          set +e
          node bin/accessprobe.js --url http://localhost/v1 --project-id accessprobe-test --source test/appwrite/app --yes --json > result.json
          code=$?
          set -e
          echo "exit code $code (1 expected: the fixture has critical leaks)"
          [ "$code" = 1 ] || { cat result.json; exit 1; }
          node test/appwrite/check.mjs result.json appwrite-setup.json
      - name: The answers the adapter relies on (status codes, error types, defaults, cookies)
        run: node test/appwrite/behaviour.mjs appwrite-setup.json
      - name: accessprobe without appwrite.json (--table only, attributes guessed)
        run: |
          set +e
          node bin/accessprobe.js --platform appwrite --url http://localhost/v1 --project-id accessprobe-test             --table main/shared_docs --table main/guestbook --table main/tasks --table main/profiles --yes --json > code-only.json
          code=$?
          set -e
          [ "$code" = 1 ] || { cat code-only.json; exit 1; }
          node test/appwrite/check-code-only.mjs code-only.json
          node -e "const r=require('./code-only.json'); if(!r.notes.some(n=>n.startsWith('Reused the test users'))){console.log(r.notes);process.exit(1)} console.log('second run reused the saved test users')"
      - if: failure()
        run: |
          cat result.json 2>/dev/null | head -c 20000 || true
          docker compose -f "$RUNNER_TEMP/aw/appwrite/docker-compose.yml" logs --tail 150 appwrite || true
