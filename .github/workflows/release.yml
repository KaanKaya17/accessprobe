name: Release
# Push a tag like v0.3.0 (matching package.json) to publish.
#
# npm: Trusted Publishing (OIDC) — no token stored anywhere. One-time setup on npmjs.com:
#   package rlsprobe → Settings → Trusted Publisher → GitHub Actions,
#   repository KaanKaya17/rlsprobe, workflow release.yml.
# (The very first publish has to be done once by hand, because the package must exist first.)
# An NPM_TOKEN secret still works as a fallback. Private repositories skip npm entirely.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write # npm provenance (public repositories)
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Tag matches package.json
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != package.json v$v"; exit 1; }
      - run: npm test
      - run: node test/package-smoke.mjs
      - name: Release notes from CHANGELOG.md
        run: |
          v=${GITHUB_REF_NAME#v}
          awk -v h="## [$v]" 'index($0, h) == 1 {f=1; next} index($0, "## [") == 1 {f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $v"; exit 1; }
      - name: Publish to npm
        if: github.event.repository.private == false
        run: |
          # Trusted Publishing needs npm >= 11.5; it also adds provenance automatically
          npm install -g npm@11.6.2
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: npm skipped (private repository)
        if: github.event.repository.private == true
        run: echo "::notice::Repository is private, so the package was not published to npm. Make it public to publish."
      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag || gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
