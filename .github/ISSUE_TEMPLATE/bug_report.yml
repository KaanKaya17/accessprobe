name: Bug report
description: A crash, a wrong message or a problem with the CLI.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the command you ran and the output. Redact keys and tokens.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "accessprobe 0.2.0, Node 22, Windows 11"
    validations:
      required: true
